name: R0 toolchain
on:
  pull_request:
    branches: [main, 'phase/**']
  push:
    branches: ['step/**', 'phase/**']
permissions:
  contents: read
concurrency:
  group: r0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENSPEC_TELEMETRY: '0'
jobs:
  toolchain:
    name: R0.1 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.10'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
      - name: Pinned tools
        run: npm install --global pnpm@10.34.7 @fission-ai/openspec@1.3.0
      - name: Backend verify
        working-directory: backend
        run: sh ./mvnw -B -ntp verify
      - name: Package offline framework probes
        working-directory: backend
        run: sh ./mvnw -B -ntp package dependency:copy-dependencies -DskipTests -DincludeScope=test -DoutputDirectory=target/probe-libs
      - name: Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Contracts and frontend
        working-directory: frontend
        run: |
          pnpm contracts:check
          pnpm contracts:test
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm links:check
      - name: OpenSpec strict validation
        run: openspec validate --all --strict --json
      - name: Frozen R0 contract baseline
        run: python3 deploy/scripts/freeze-contracts.py
      - name: Scoped Maven SBOM
        working-directory: backend
        run: |
          sh ./mvnw -B -ntp -Paudit-sbom cyclonedx:makeAggregateBom -DincludeTestScope=false -DoutputName=bom-production
          sh ./mvnw -B -ntp -Paudit-sbom cyclonedx:makeAggregateBom -DincludeTestScope=true -DoutputName=bom-with-tests
      - name: Linux Docker acceptance
        run: |
          docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml config --quiet
          docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml up -d --build --wait --wait-timeout 120
      - name: Offline non-root framework acceptance
        run: |
          docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml --profile framework-probe build framework-probe
          docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml --profile framework-probe run --name agentplatform-r02-ci-probe framework-probe
          mkdir -p evidence/r0.2
          docker cp agentplatform-r02-ci-probe:/reports evidence/r0.2/linux-reports
          docker rm agentplatform-r02-ci-probe
      - name: Real API contracts and browser scenarios
        working-directory: frontend
        run: |
          API_BASE_URL=http://127.0.0.1:18080 pnpm contracts:test
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: R0.3 real storage contracts
        run: bash deploy/scripts/ci-storage.sh
      - name: Deployment script syntax
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/scripts/*.py deploy/probes/*.py
      - name: R0.4 blocking dependency audit
        run: |
          python3 deploy/scripts/install-audit-tools.py
          .tools/audit/grype db update
          mkdir -p evidence/r0.4
          .tools/audit/grype db status -o json > evidence/r0.4/grype-db-status.json
          .tools/audit/grype sbom:backend/target/bom-production.json --fail-on high -o json --file evidence/r0.4/backend-vulnerabilities.json
      - name: Preserve failure logs
        if: failure()
        run: docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml logs --no-color
      - name: Stop only the R0 shell
        if: always()
        run: docker compose -p agentplatform-app -f deploy/compose.r0.1.yaml down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r0-1-verification
          path: |
            frontend/test-results
            frontend/playwright-report
            backend/platform-app/target/surefire-reports
            backend/platform-infrastructure/target/surefire-reports
            evidence/r0.2/linux-reports
            evidence/r0.3
            evidence/r0.4
            backend/**/target/bom-*.json
          retention-days: 30
