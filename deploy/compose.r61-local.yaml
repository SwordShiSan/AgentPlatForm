name: agentplatform-r61-local
x-app: &app
  image: ${R61_API_IMAGE:?Build the local API image first}
  user: "10001:10001"
  read_only: true
  restart: "no"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=700"]
  networks: [r61]
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    restart: "no"
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 1
    environment: {POSTGRES_DB: r61_app, POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password}
    secrets: [postgres_password]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [r61]
    healthcheck: {test: [CMD, pg_isready, -U, postgres, -d, r61_app], interval: 2s, timeout: 3s, retries: 30}
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: agentplatform-r61-mq
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    environment: {RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 4"}
    volumes:
      - "mq-data:/var/lib/rabbitmq"
      - "${R61_ROOT:?Set fixture directory}/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      - "${R61_ROOT}/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro"
    networks: [r61]
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 24}
  api:
    <<: *app
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    entrypoint: [java, -Xms32m, -Xmx224m, -jar, /app/platform.jar]
    environment:
      SPRING_PROFILES_ACTIVE: identity-local,chat-local,workspace-api
      PLATFORM_STORAGE_JDBC_URL: jdbc:postgresql://postgres:5432/${R61_DATABASE}?connectTimeout=2&socketTimeout=5
      PLATFORM_STORAGE_USER: ap_api
      PLATFORM_STORAGE_PASSWORD_FILE: /run/secrets/api_password
      PLATFORM_IDENTITY_ORIGINS: http://127.0.0.1:${R61_PORT},http://localhost:${R61_PORT}
      PLATFORM_IDENTITY_SECURE_COOKIE: "false"
      PLATFORM_CHAT_PLAN_ENABLED: "true"
      PLATFORM_CHAT_PERMISSIONS_ENABLED: "true"
      PLATFORM_CHAT_CONTEXT_V2_ENABLED: "true"
      PLATFORM_CHAT_CONTEXT_WINDOW_TOKENS: "262144"
      PLATFORM_CHAT_CONTEXT_MAX_OUTPUT_TOKENS: "4096"
      PLATFORM_PERSONAL_CONFIG_ENABLED: "true"
      PLATFORM_WORKSPACE_ENABLED: "true"
      PLATFORM_CHAT_MQ_HOST: rabbitmq
      PLATFORM_CHAT_MQ_USER: ap_api
      PLATFORM_CHAT_MQ_PASSWORD_FILE: /run/secrets/mq_api_password
      PLATFORM_CHAT_CURSOR_KEY_FILE: /run/secrets/cursor_key
      PLATFORM_CHAT_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [api_password,mq_api_password,cursor_key,master_key]
    healthcheck: {test: [CMD, java, -cp, /app/health, HttpHealthcheck, "http://127.0.0.1:8080/api/v1/readiness"], interval: 5s, timeout: 4s, retries: 24}
  worker:
    <<: *app
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1
    entrypoint: [java, -Xms32m, -Xmx320m, -XX:MaxDirectMemorySize=64m, -jar, /app/platform.jar]
    environment:
      SPRING_PROFILES_ACTIVE: chat-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      PLATFORM_STORAGE_JDBC_URL: jdbc:postgresql://postgres:5432/${R61_DATABASE}?connectTimeout=2&socketTimeout=5
      PLATFORM_STORAGE_USER: ap_worker
      PLATFORM_STORAGE_PASSWORD_FILE: /run/secrets/worker_password
      PLATFORM_CHAT_MQ_HOST: rabbitmq
      PLATFORM_CHAT_MQ_USER: ap_worker
      PLATFORM_CHAT_MQ_PASSWORD_FILE: /run/secrets/mq_worker_password
      PLATFORM_CHAT_MASTER_KEY_FILE: /run/secrets/master_key
      PLATFORM_CHAT_PROVIDER_BASE: http://fixture:8080
      PLATFORM_CHAT_FIXTURE_PROVIDER: "true"
      PLATFORM_CHAT_CONTEXT_V2_ENABLED: "true"
      PLATFORM_CHAT_CONTEXT_WINDOW_TOKENS: "262144"
      PLATFORM_CHAT_CONTEXT_MAX_OUTPUT_TOKENS: "4096"
    secrets: [worker_password,mq_worker_password,master_key]
    healthcheck: {test: [CMD-SHELL, "test -s /tmp/chat-worker-ready"], interval: 5s, timeout: 3s, retries: 24}
  operator:
    <<: *app
    profiles: [operator]
    mem_limit: 320m
    memswap_limit: 320m
    entrypoint: [java, -Xms16m, -Xmx160m, -jar, /app/platform.jar]
    environment:
      SPRING_PROFILES_ACTIVE: chat-ops
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      PLATFORM_STORAGE_JDBC_URL: jdbc:postgresql://postgres:5432/${R61_DATABASE}?connectTimeout=2&socketTimeout=5
      PLATFORM_STORAGE_USER: postgres
      PLATFORM_STORAGE_PASSWORD_FILE: /run/secrets/postgres_password
      PLATFORM_CHAT_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [postgres_password,master_key]
  gateway:
    image: ${R61_GATEWAY_IMAGE:?Build the local gateway first}
    user: "101:101"
    read_only: true
    restart: "no"
    mem_limit: 32m
    memswap_limit: 32m
    memswap_limit: 32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    ports: ["127.0.0.1:${R61_PORT}:8080"]
    networks: [r61]
  fixture:
    image: ${R61_FIXTURE_IMAGE:?Build the deterministic fixture first}
    user: "10001:10001"
    read_only: true
    restart: "no"
    mem_limit: 64m
    memswap_limit: 64m
    environment: {AP_FIXTURE_PROFILE: R54}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [r61]
secrets:
  postgres_password: {file: "${R61_ROOT:?Set fixture directory}/postgres-password"}
  api_password: {file: "${R61_ROOT}/api-password"}
  worker_password: {file: "${R61_ROOT}/worker-password"}
  mq_api_password: {file: "${R61_ROOT}/mq-api-password"}
  mq_worker_password: {file: "${R61_ROOT}/mq-worker-password"}
  master_key: {file: "${R61_ROOT}/master-key"}
  cursor_key: {file: "${R61_ROOT}/cursor-key"}
volumes: {postgres-data: {}, mq-data: {}}
networks:
  r61:
    ipam:
      config: [{subnet: "${R61_SUBNET:?Set isolated subnet}"}]
