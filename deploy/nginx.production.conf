pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  upstream platform_api {
    zone platform_api 64k;
    server api:8080 resolve;
  }
  server { listen 8080 default_server; server_name _; return 404; }
  server {
    listen 8080;
    server_name agentplatform.lailihao.cloud 124.222.55.140;
    client_max_body_size 96k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/api/v1/conversations/[^/]+/events$ {
      proxy_pass http://platform_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 130s;
      proxy_send_timeout 10s;
      send_timeout 10s;
      proxy_buffering off;
      proxy_cache off;
      proxy_next_upstream off;
      gzip off;
    }
    location ~ "^/api/v1/uploads/[a-f0-9-]{36}/content$" {
      client_max_body_size 100m;
      client_body_buffer_size 16k;
      client_body_timeout 30s;
      proxy_pass http://platform_api;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 130s;
      proxy_send_timeout 130s;
      send_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/api/v1/files/[a-f0-9-]{36}/content$" {
      proxy_pass http://platform_api;
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 130s;
      send_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      proxy_pass http://platform_api;
      proxy_connect_timeout 3s;
      proxy_read_timeout 150s;
      proxy_buffering off;
      proxy_cache off;
      proxy_next_upstream off;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /internal/ { return 404; }
    location = /internal { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /actuator { return 404; }
    location = /metrics { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
