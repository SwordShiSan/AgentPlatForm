pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  resolver 127.0.0.11 valid=5s;
  upstream file_api { zone file_api 64k; server api:8080 resolve; }
  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 96k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ "^/api/v1/uploads/[a-f0-9-]{36}/content$" {
      client_max_body_size 100m;
      client_body_buffer_size 16k;
      client_body_timeout 30s;
      proxy_pass http://file_api;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 130s;
      proxy_send_timeout 130s;
      send_timeout 30s;
      proxy_set_header Host $host;
    }
    location ~ "^/api/v1/files/[a-f0-9-]{36}/content$" {
      proxy_pass http://file_api;
      proxy_buffering off;
      proxy_max_temp_file_size 0;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 130s;
      send_timeout 30s;
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass http://file_api;
      proxy_connect_timeout 2s;
      proxy_read_timeout 40s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      proxy_next_upstream off;
      gzip off;
      proxy_set_header Host $host;
    }
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /metrics { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
