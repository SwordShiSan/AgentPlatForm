name: agentplatform-env
x-common: &common
  restart: "no"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  networks: [backplane]
  pids_limit: 128
services:
  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf}
    user: "999:999"
    mem_limit: 320m
    shm_size: 32m
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=16MB]
    environment: {POSTGRES_DB: agentplatform, POSTGRES_USER: ap_admin, POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin}
    secrets: [pg_admin, pg_api, pg_worker, pg_filer, pg_migration]
    volumes:
      - ${PLATFORM_ROOT:-/srv/agentplatform}/data/postgres:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/10-platform.sh:ro
    healthcheck: {test: [CMD-SHELL, "pg_isready -U ap_admin -d agentplatform"], interval: 5s, timeout: 3s, retries: 24}
  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    user: "999:999"
    mem_limit: 64m
    read_only: true
    command: [redis-server, /etc/redis/redis.conf]
    volumes: ["${PLATFORM_ROOT:-/srv/agentplatform}/config/redis.conf:/etc/redis/redis.conf:ro"]
    secrets: [redis]
    healthcheck: {test: [CMD-SHELL, "REDISCLI_AUTH=$$(cat /run/secrets/redis) redis-cli ping | grep PONG"], interval: 5s, timeout: 3s, retries: 12}
  rabbitmq:
    <<: *common
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd}
    user: "999:999"
    mem_limit: 256m
    pids_limit: 256
    environment: {RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 4", RABBITMQ_NODENAME: rabbit@rabbitmq}
    hostname: rabbitmq
    volumes:
      - ${PLATFORM_ROOT:-/srv/agentplatform}/data/rabbitmq:/var/lib/rabbitmq
      - ${PLATFORM_ROOT:-/srv/agentplatform}/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ${PLATFORM_ROOT:-/srv/agentplatform}/config/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 15s, timeout: 10s, retries: 20}
  master:
    <<: *common
    image: &weed ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d}
    user: "10001:10001"
    mem_limit: 64m
    environment: {GOMEMLIMIT: 48MiB, GOMAXPROCS: "1"}
    command: [master, -ip=master, -mdir=/data, -volumeSizeLimitMB=512]
    volumes: ["${PLATFORM_ROOT:-/srv/agentplatform}/data/object-master:/data", "${PLATFORM_ROOT:-/srv/agentplatform}/config/master.toml:/etc/seaweedfs/master.toml:ro"]
    healthcheck: {test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:9333/cluster/status | grep -qi '\"IsLeader\":[[:space:]]*true'"], interval: 5s, timeout: 3s, retries: 24, start_period: 10s}
  volume:
    <<: *common
    image: *weed
    user: "10001:10001"
    mem_limit: 96m
    environment: {GOMEMLIMIT: 64MiB, GOMAXPROCS: "1"}
    command: [volume, -ip=volume, -ip.bind=0.0.0.0, -master=master:9333, -dir=/data, -max=8]
    volumes: ["${PLATFORM_ROOT:-/srv/agentplatform}/data/object-volume:/data"]
    depends_on: {master: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/status"], interval: 5s, timeout: 3s, retries: 24}
  filer:
    <<: *common
    image: *weed
    user: "10001:10001"
    mem_limit: 96m
    environment: {GOMEMLIMIT: 64MiB, GOMAXPROCS: "1"}
    command: [filer, -ip=filer, -master=master:9333]
    volumes: ["${PLATFORM_ROOT:-/srv/agentplatform}/config/filer.toml:/etc/seaweedfs/filer.toml:ro", "${PLATFORM_ROOT:-/srv/agentplatform}/data/object-filer:/data"]
    depends_on: {postgres: {condition: service_healthy}, volume: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8888/"], interval: 5s, timeout: 3s, retries: 24}
  s3:
    <<: *common
    image: *weed
    user: "10001:10001"
    mem_limit: 64m
    environment: {GOMEMLIMIT: 48MiB, GOMAXPROCS: "1"}
    entrypoint: [/bin/sh, -ec]
    command: ['export WEED_S3_SSE_KEK_PASSPHRASE="$$(cat /run/secrets/s3_kek)"; exec weed s3 -ip.bind=0.0.0.0 -filer=filer:8888 -config=/etc/seaweedfs/s3.json -iam=false']
    secrets: [s3_kek]
    volumes: ["${PLATFORM_ROOT:-/srv/agentplatform}/config/s3.json:/etc/seaweedfs/s3.json:ro"]
    depends_on: {filer: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403'"], interval: 5s, timeout: 3s, retries: 24}
networks:
  backplane: {name: "${PLATFORM_BACKPLANE:-agentplatform-backplane}", internal: true}
secrets:
  pg_admin: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/pg_admin"}
  pg_api: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/pg_api"}
  pg_worker: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/pg_worker"}
  pg_filer: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/pg_filer"}
  pg_migration: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/pg_migration"}
  redis: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/redis"}
  s3_kek: {file: "${PLATFORM_ROOT:-/srv/agentplatform}/secrets/s3_kek"}
