pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=5s;
  upstream chat_api { zone chat_api 64k; server api:8080 resolve; }
  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 96k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
      proxy_pass http://chat_api;
      proxy_connect_timeout 2s;
      proxy_read_timeout 40s;
      proxy_send_timeout 10s;
      send_timeout 10s;
      gzip off;
      proxy_buffering off;
      proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
