spring:
  application:
    name: agentplatform
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
  shutdown: graceful
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health,metrics
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
platform:
  runtime:
    agentscope:
      enabled: false
