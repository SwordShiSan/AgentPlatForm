spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: agentplatform
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 10s
management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health,metrics
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
platform:
  runtime:
    agentscope:
      enabled: false

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
  type-handlers-package: com.agentplatform.infrastructure.dao.typehandler
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT
    cache-enabled: false
    default-statement-timeout: 5
