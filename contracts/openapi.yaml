    WorkspaceToolReview:
      type: object
      additionalProperties: false
      required:
        - kind
        - command
        - cwd
        - path
        - fileId
        - versionId
        - writeMode
        - textSha256
        - bytes
        - outputs
        - impact
        - network
        - stopsAfterEachCall
      properties:
        kind:
          enum:
            - LIST
            - READ
            - WRITE
            - SHELL
        command:
          type:
            - string
            - "null"
          maxLength: 32768
        cwd:
          type:
            - string
            - "null"
          maxLength: 4096
        path:
          type:
            - string
            - "null"
          maxLength: 4096
        fileId:
          type:
            - string
            - "null"
          format: uuid
        versionId:
          type:
            - string
            - "null"
          format: uuid
        writeMode:
          type:
            - string
            - "null"
          enum:
            - CREATE
            - REPLACE
            - null
        textSha256:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        bytes:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 32768
        outputs:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - maxBytes
            properties:
              path:
                type: string
                maxLength: 4096
              maxBytes:
                type: integer
                minimum: 0
                maximum: 104857600
        impact:
          enum:
            - WORKSPACE_INDEX
            - EXPLICIT_VERSION
            - NAMED_FILE
            - ENTIRE_BOUND_WORKSPACE
        network:
          const: NONE
        stopsAfterEachCall:
          type: boolean
    TaskToolOperation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - taskId
        - toolName
        - status
        - phase
        - summary
        - createdAt
        - endedAt
        - errorCode
        - traceId
        - review
        - resultAvailable
      properties:
        operationId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        toolName:
          enum:
            - workspace_list
            - workspace_read
            - workspace_write
            - workspace_shell
        status:
          enum:
            - PREPARED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - DENIED
        phase:
          enum:
            - PREPARED
            - WAITING_APPROVAL
            - ENVIRONMENT_PREPARING
            - RUNNING
            - STOPPING
            - SEALING
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - DENIED
        summary:
          type: string
          maxLength: 4096
        createdAt:
          type: string
          format: date-time
        endedAt:
          type:
            - string
            - "null"
          format: date-time
        errorCode:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,95}$
        traceId:
          type:
            - string
            - "null"
          maxLength: 128
        review:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceToolReview"
            - type: "null"
        resultAvailable:
          type: boolean
    TaskToolOperations:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TaskToolOperation"
        nextCursor:
          type:
            - string
            - "null"
          format: uuid
    WorkspaceToolArtifact:
      type: object
      additionalProperties: false
      required:
        - fileId
        - versionId
        - path
        - bytes
        - sha256
      properties:
        fileId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 4096
        bytes:
          type: integer
          minimum: 0
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    WorkspaceToolResult:
      type: object
      additionalProperties: false
      required:
        - operationId
        - taskId
        - status
        - summary
        - exitCode
        - stdout
        - stderr
        - truncated
        - errorCode
        - files
      properties:
        operationId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          enum:
            - PREPARED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - DENIED
        summary:
          type: string
          maxLength: 8192
        exitCode:
          type:
            - integer
            - "null"
        stdout:
          type:
            - string
            - "null"
          maxLength: 65536
        stderr:
          type:
            - string
            - "null"
          maxLength: 65536
        truncated:
          type: boolean
        errorCode:
          type:
            - string
            - "null"
          pattern: ^[A-Z][A-Z0-9_]{1,95}$
        files:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
              - fileId
              - versionId
              - path
              - bytes
              - sha256
            properties:
              fileId:
                type: string
                format: uuid
              versionId:
                type: string
                format: uuid
              path:
                type: string
                maxLength: 4096
              bytes:
                type: integer
                minimum: 0
                maximum: 104857600
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
      description: Live-authorized bounded tool result. Raw stdout/stderr UTF-8 bytes
        combined are at most64KiB; a large result is fetched from private storage
        without exposing its key. Model summary is at most8KiB UTF-8. No host paths,
        credentials, SDK state or private parameter maps.

    CreateAttachmentUpload:
      type: object
      additionalProperties: false
      required: [draftId, filename, bytes, sha256]
      properties:
        draftId: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 1024 }
        bytes: { type: integer, minimum: 0, maximum: 104857600 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    AttachmentUpload:
      type: object
      additionalProperties: false
      required: [id, attachmentId, status, bytes, sha256, revision, expiresAt, allowedActions]
      properties:
        id: { type: string, format: uuid }
        attachmentId: { type: string, format: uuid }
        status: { type: string, enum: [CREATED, UPLOADING, VERIFYING, VERIFIED, COMMITTED, ABORTED, EXPIRED, UNKNOWN] }
        bytes: { type: integer, minimum: 0, maximum: 104857600 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        revision: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        allowedActions: { type: array, items: { type: string } }
    ChatAttachment:
      type: object
      additionalProperties: false
      required: [id, filename, bytes, sha256, status, conversationId, revision, allowedActions]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        bytes: { type: integer, minimum: 0, maximum: 104857600 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [STAGING, AVAILABLE, FAILED, EXPIRED, BLOCKED] }
        conversationId: { type: [string, "null"], format: uuid }
        revision: { type: integer, minimum: 1 }
        allowedActions: { type: array, items: { type: string } }
    CreateAttachmentPreview:
      type: object
      additionalProperties: false
      properties:
        format: { type: string, enum: [AUTO, PDF, IMAGE, HTML_STATIC] }
    CreateDocumentExtraction:
      oneOf:
        - type: object
          additionalProperties: false
          required: [fileId, versionId]
          properties:
            fileId: { type: string, format: uuid }
            versionId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [attachmentId]
          properties:
            attachmentId: { type: string, format: uuid }
    DocumentExtraction:
      type: object
      additionalProperties: false
      required: [id, sourceKind, fileId, versionId, attachmentId, name, status, bytes, sha256, errorCode, retryable, revision, allowedActions]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [FILE_VERSION, CHAT_ATTACHMENT] }
        fileId: { type: [string, "null"], format: uuid }
        versionId: { type: [string, "null"], format: uuid }
        attachmentId: { type: [string, "null"], format: uuid }
        name: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, READY, FAILED, BLOCKED] }
        bytes: { type: [integer, "null"], minimum: 0, maximum: 2097152 }
        sha256: { type: [string, "null"], pattern: '^[a-f0-9]{64}$' }
        errorCode: { type: [string, "null"] }
        retryable: { type: boolean }
        revision: { type: integer, minimum: 1 }
        allowedActions: { type: array, items: { type: string } }
    AttachmentReference:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, fileId, versionId, extractionId]
          properties:
            kind: { const: FILE_VERSION }
            fileId: { type: string, format: uuid }
            versionId: { type: string, format: uuid }
            extractionId: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [kind, attachmentId, extractionId]
          properties:
            kind: { const: CHAT_ATTACHMENT }
            attachmentId: { type: string, format: uuid }
            extractionId: { type: string, format: uuid }
    ChatFileReferenceBlock:
      type: object
      additionalProperties: false
      required: [type, blockId, sourceKind, extractionId, name, sourceSha256, textSha256]
      properties:
        type: { const: FILE_REFERENCE }
        blockId: { type: string, format: uuid }
        sourceKind: { type: string, enum: [FILE_VERSION, CHAT_ATTACHMENT] }
        extractionId: { type: string, format: uuid }
        name: { type: string }
        sourceSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        textSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        fileId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        attachmentId: { type: string, format: uuid }

    WorkbenchLayout:
      type: object
      additionalProperties: false
      required: [view, sidebarWidth]
      properties:
        view: { type: string, enum: [SPLIT, CHAT, FILES] }
        sidebarWidth: { type: integer, minimum: 240, maximum: 640 }
    RecentWorkbenchFile:
      type: object
      additionalProperties: false
      required: [workspaceId, fileId, versionId]
      properties:
        workspaceId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
    ContextCapacity:
      type: object
      additionalProperties: false
      required: [modelWindow, window, maxOutput, safetyTokens, inputLimit, estimation]
      properties:
        modelWindow: { type: integer, minimum: 8192, maximum: 1000000 }
        window: { type: integer, minimum: 8192, maximum: 524288 }
        maxOutput: { type: integer, minimum: 1, maximum: 8192 }
        safetyTokens: { type: integer, minimum: 0 }
        inputLimit: { type: integer, minimum: 1 }
        estimation: { const: SDK_MULTILINGUAL_ESTIMATE }
    PersonalStorageUsage:
      type: object
      additionalProperties: false
      required: [objectLimitBytes, usedBytes, reservedBytes, retainedBytes, categories]
      properties:
        objectLimitBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        reservedBytes: { type: integer, minimum: 0 }
        retainedBytes: { type: integer, minimum: 0, description: Subset of usedBytes retained for deleted working copies; not added a second time }
        categories:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [category, bytes, objects]
            properties:
              category: { type: string, enum: [file-version, chat-attachment, preview, text-extraction] }
              bytes: { type: integer, minimum: 0 }
              objects: { type: integer, minimum: 0 }
