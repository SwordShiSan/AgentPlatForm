          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current task authorization projection
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPermissions"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/tasks/{id}/operations:
    get:
      operationId: getTaskOperations
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Authorized committed tool projection; UNKNOWN never grants replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskToolOperations"
        default:
