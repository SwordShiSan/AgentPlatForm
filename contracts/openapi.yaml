        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized committed tool projection; UNKNOWN never grants replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceToolResult"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/files/{id}/previews:
    post:
      operationId: createFilePreview
      summary: Queue a preview of one authorized immutable file version
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/SpaceSelector"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "202":
          description: Stable preview identity; only READY authorizes viewing committed output
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePreview" }
        default: { $ref: "#/components/responses/IdentityProblem" }
  /api/v1/previews/{id}:
    get:
      operationId: getFilePreview
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/SpaceSelector"
      responses:
        "200":
          description: Authorized persistent job projection; cache identity does not grant access
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePreview" }
        default: { $ref: "#/components/responses/IdentityProblem" }
  /api/v1/previews/{id}/content:
    get:
      operationId: getFilePreviewContent
      security: [{ session: [] }]
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/SpaceSelector"
        - name: Range
          in: header
          schema: { type: string, maxLength: 128 }
          description: One byte range; parallel fetches must respect global transfer admission
      responses:
        "200":
          description: Verified preview bytes; original attachment download remains separate
          headers:
            ETag: { schema: { type: string } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            Accept-Ranges: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }
        "206":
          description: Authorized single-range preview response
          headers:
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/IdentityProblem" }
  /api/v1/previews/{id}/retry:
    post:
      operationId: retryFilePreview
      security: [{ session: [] }]
      parameters:
