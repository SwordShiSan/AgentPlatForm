      type: object
      additionalProperties: false
      maxProperties: 0
    WorkspaceEnvironment:
      type: object
      additionalProperties: false
      required: [workspaceId, state, phase, generation, version, operationId, errorCode, allowedActions]
      allOf:
        - if: { properties: { state: { const: NOT_CREATED } }, required: [state] }
          then:
            properties:
              phase: { const: NONE }
              generation: { const: 0 }
              version: { const: 0 }
              operationId: { type: "null" }
              errorCode: { type: "null" }
              allowedActions: { type: array, items: { const: PREPARE } }
        - if: { properties: { phase: { enum: [PREPARING, STOPPING, DELETING, BLOCKED] } }, required: [phase] }
          then: { properties: { allowedActions: { type: array, maxItems: 0 } } }
        - if: { properties: { state: { const: READY } }, required: [state] }
          then: { properties: { allowedActions: { type: array, items: { enum: [SLEEP, DELETE] } } } }
        - if: { properties: { state: { const: ERROR } }, required: [state] }
          then: { properties: { allowedActions: { type: array, items: { const: RETRY } } } }
        - if: { properties: { state: { const: STOPPED } }, required: [state] }
          then: { properties: { allowedActions: { type: array, items: { enum: [PREPARE, WAKE, DELETE] } } } }
        - if: { properties: { state: { const: DELETED } }, required: [state] }
          then: { properties: { phase: { const: DELETED }, allowedActions: { type: array, maxItems: 1, items: { const: PREPARE } } } }
        - if: { properties: { state: { not: { const: NOT_CREATED } } }, required: [state] }
          then:
            properties:
              generation: { type: integer, minimum: 1 }
              version: { type: integer, minimum: 1 }
              operationId: { type: string, format: uuid }
      properties:
        workspaceId: { type: string, format: uuid }
        state: { type: string, enum: [NOT_CREATED, PREPARING, READY, STOPPING, STOPPED, DELETING, DELETED, ERROR, BLOCKED] }
        phase: { type: string, enum: [NONE, PREPARING, READY, STOPPING, STOPPED, DELETING, DELETED, ERROR, BLOCKED] }
        generation: { type: integer, minimum: 0, maximum: 9007199254740991 }
        version: { type: integer, minimum: 0, maximum: 9007199254740991 }
        operationId: { type: [string, "null"], format: uuid }
        errorCode: { type: [string, "null"], pattern: '^[A-Z_]{1,64}$' }
        allowedActions:
          type: array
          uniqueItems: true
          maxItems: 2
          items: { type: string, enum: [PREPARE, RETRY, SLEEP, WAKE, DELETE] }
