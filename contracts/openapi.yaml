openapi: 3.1.0
info:
  title: Agent PlatForm shell API
  version: 0.1.0
  description: Shell liveness and R0.3 storage-schema/dependency transport readiness. No model or task execution readiness claim.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application shell health
      responses:
        '200':
          description: The application shell is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Structured failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/readiness:
    get:
      operationId: getReadiness
      summary: Check baseline schema and required dependency connectivity
      responses:
        '200':
          description: Baseline dependencies reachable and schema compatible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '503':
          description: Baseline unavailable or not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
components:
  schemas:
    ReadinessResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [READY, NOT_READY]}
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP]
    Problem:
      type: object
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        traceId: {type: string}
        retryable: {type: boolean}
        resourceId: {type: string}
