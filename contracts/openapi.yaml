openapi: 3.1.0
info:
  title: Agent PlatForm API
  version: 0.1.0
  description: R0 health/readiness, local opt-in identity and R1.2 ordinary queued text chat. Cloud R0 does not enable identity/chat.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application shell health
      responses:
        "200":
          description: The application shell is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          description: Structured failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/readiness:
    get:
      operationId: getReadiness
      summary: Check baseline schema and required dependency connectivity
      responses:
        "200":
          description: Baseline dependencies reachable and schema compatible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Baseline unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Create or rotate a session-bound CSRF token (local identity profile)
      responses:
        "200":
          description: CSRF token and HttpOnly session cookie; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session and CSRF rotated; opaque cookie is not in JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - session: []
      parameters:
        - name: X-Space-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Optional space selector; membership is always verified
      responses:
        "200":
          description: Current actor and authorized space summaries only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie cleared
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/models:
    get:
      operationId: getModels
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModels"
        default: &a1
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/conversations:
    get:
      operationId: getConversations
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: cursor
          in: query
          schema: &a5
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversations"
        default: *a1
    post:
      operationId: createConversation
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversation"
      responses:
        "201":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default: *a1
  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - &a2
          name: id
          in: path
          required: true
          schema: &a4
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default: *a1
  /api/v1/conversations/{id}/snapshot:
    get:
      operationId: getConversationSnapshot
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSnapshot"
        default: *a1
  /api/v1/conversations/{id}/tasks:
    post:
      operationId: submitChatTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitChatTask"
      responses:
        "202":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAccepted"
        default: *a1
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTask"
        default: *a1
  /api/v1/tasks/{id}/usage:
    get:
      operationId: getTaskUsage
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUsages"
        default: *a1
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Authorized committed platform state; no provider secrets or internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTask"
        default: *a1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
  /api/v1/conversations/{id}/events:
    get:
      operationId: getConversationEvents
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - name: after
          in: query
          schema: &a10
            type: integer
            minimum: 0
            maximum: 9007199254740991
          description: Committed cursor; wins over Last-Event-ID. Expired cursor returns410 and requires a fresh snapshot.
        - name: Last-Event-ID
          in: header
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        "200":
          description: SSE event platform_event; id is seq. Only committed events, Unicode codepoint offsets. Disconnect does not cancel. Bounded connections reconnect from cursor.
          content:
            text/event-stream:
              schema:
                type: string
        default: *a1
  /api/v1/me/preferences:
    get:
      operationId: chatPreferences
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPreferences"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
    patch:
      operationId: updateChatPreferences
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPreferences"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: &a3
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatPreferences"
  /api/v1/effective-config:
    get:
      operationId: effectiveChatConfig
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveChatConfig"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/me/model-credentials:
    get:
      operationId: modelCredentials
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/me/model-credentials/deepseek:
    put:
      operationId: putUserModelCredential
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: *a3
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutModelCredential"
    delete:
      operationId: revokeUserModelCredential
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: *a3
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/tasks/{id}/configuration:
    get:
      operationId: taskConfiguration
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskConfiguration"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: id
          in: path
          required: true
          schema: &a12
            type: string
            format: uuid
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ap_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
      description: Session-bound token; writes also require an exact allowed Origin
    SpaceSelector:
      name: X-Space-Id
      in: header
      required: false
      schema: *a4
      description: Optional selector; current membership and credential policy are always checked.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *a4
      description: Reuse for an uncertain response. Same actor/space/path/key with another body returns409.
  responses:
    IdentityProblem:
      description: Identity request rejected (400/401/403/404/409/429/503)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 128
    CsrfResponse:
      type: object
      additionalProperties: false
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - platformAdmin
        - spaces
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        platformAdmin:
          type: boolean
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/SpaceResponse"
    SpaceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - role
        - objectLimitBytes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - PERSONAL
            - ORGANIZATION
        role:
          type: string
          enum:
            - OWNER
            - ADMIN
            - MEMBER
            - VIEWER
        objectLimitBytes:
          type: integer
          minimum: 0
    ReadinessResponse:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
    HealthResponse:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - UP
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - traceId
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        resourceId:
          type: string
    ChatModel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - capabilities
        - available
      properties:
        id: *a4
        name: *a5
        capabilities:
          type: array
          items:
            const: TEXT
        available: &a6
          type: boolean
    ChatModels:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatModel"
    ChatConversation:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - version
        - updatedAt
      properties:
        id: *a4
        title: *a5
        version: &a8
          type: integer
          minimum: 1
          maximum: 9007199254740991
        updatedAt:
          type: string
          format: date-time
        initialTask:
          oneOf:
            - $ref: "#/components/schemas/ChatAccepted"
            - type: "null"
    ChatConversations:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversation"
        nextCursor: &a7
          type:
            - string
            - "null"
    CreateConversation:
      type: object
      additionalProperties: false
      required: []
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        workspaceId:
          type: "null"
        initialTask:
          $ref: "#/components/schemas/SubmitChatTask"
    ChatTask:
      type: object
      additionalProperties: false
      required:
        - taskId
        - conversationId
        - status
        - cancelRequested
        - reasonCode
        - version
      properties:
        taskId: *a4
        conversationId: *a4
        status: &a9
          type: string
          enum:
            - QUEUED
            - RUNNING
            - BLOCKED
            - SUCCEEDED
            - FAILED
            - CANCELLED
        cancelRequested: *a6
        reasonCode: *a7
        version: *a8
    ChatAccepted:
      type: object
      additionalProperties: false
      required:
        - taskId
        - conversationId
        - status
        - cursor
      properties:
        taskId: *a4
        conversationId: *a4
        status: *a9
        cursor: *a10
    SubmitChatTask:
      type: object
      additionalProperties: false
      required:
        - input
        - options
      properties:
        input:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 8192
            attachments:
              type: array
              maxItems: 0
              items: {}
        options:
          type: object
          additionalProperties: false
          required: []
          properties:
            modelId: *a4
            planMode:
              const: false
            permissionMode:
              const: RISK_BASED
            credentialSource: &a11
              type: string
              enum:
                - PLATFORM
                - USER
    ChatTextBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - blockId
        - text
      properties:
        type:
          const: TEXT
        blockId: *a4
        text: *a5
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - taskId
        - role
        - blocks
        - status
        - version
      properties:
        id: *a4
        taskId: *a4
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ChatTextBlock"
        status:
          type: string
          enum:
            - COMPLETED
            - STREAMING
            - PARTIAL
            - FAILED
        version: *a8
    ChatSnapshot:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - cursor
        - messages
        - tasks
        - pending
        - artifacts
      properties:
        schemaVersion:
          const: 1
        cursor: *a10
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ChatTask"
        pending:
          type: array
          maxItems: 0
          items: {}
        artifacts:
          type: array
          maxItems: 0
          items: {}
    ChatUsage:
      type: object
      additionalProperties: false
      required:
        - callId
        - status
        - inputTokens
        - outputTokens
        - costMicros
        - estimated
      properties:
        callId: *a4
        status:
          type: string
          enum:
            - PREPARED
            - STARTED
            - COMPLETED
            - FAILED
            - UNKNOWN
        inputTokens:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        outputTokens:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        costMicros:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        estimated: *a6
    ChatUsages:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatUsage"
    ChatPreferences:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        defaultModelId:
          type:
            - string
            - "null"
          format: uuid
        defaultCredentialSource: *a11
      required:
        - version
        - defaultModelId
        - defaultCredentialSource
    UpdateChatPreferences:
      type: object
      additionalProperties: false
      properties:
        defaultModelId:
          type:
            - string
            - "null"
          format: uuid
        defaultCredentialSource: *a11
      required: []
    ModelCredentials:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        userConfigured:
          type: boolean
        platformAvailable:
          type: boolean
      required:
        - version
        - userConfigured
        - platformAvailable
    PutModelCredential:
      type: object
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
      required:
        - apiKey
    EffectiveChatConfig:
      type: object
      additionalProperties: false
      properties:
        values:
          type: object
          additionalProperties: false
          properties:
            modelId: *a12
            credentialSource: *a11
          required:
            - modelId
            - credentialSource
        sources:
          type: object
          additionalProperties: false
          properties:
            modelId: *a3
            credentialSource: *a3
          required:
            - modelId
            - credentialSource
        lockedFields:
          type: array
          items: *a3
        configHash: *a3
      required:
        - values
        - sources
        - lockedFields
        - configHash
    TaskConfiguration:
      type: object
      additionalProperties: false
      properties:
        configSnapshotId: *a12
        configHash: *a3
        bundleId: *a12
        values:
          type: object
          additionalProperties: true
        restrictions:
          type: object
          additionalProperties: false
          properties:
            credentialActive:
              type: boolean
            modelActive:
              type: boolean
          required:
            - credentialActive
            - modelActive
      required:
        - configSnapshotId
        - configHash
        - bundleId
        - values
        - restrictions
