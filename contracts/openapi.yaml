openapi: 3.1.0
info:
  title: Agent PlatForm shell API
  version: 0.1.0
  description: Shell liveness and R0.3 storage-schema/dependency transport readiness. No model or task execution readiness claim.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application shell health
      responses:
        '200':
          description: The application shell is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Structured failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/readiness:
    get:
      operationId: getReadiness
      summary: Check baseline schema and required dependency connectivity
      responses:
        '200':
          description: Baseline dependencies reachable and schema compatible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '503':
          description: Baseline unavailable or not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Create or rotate a session-bound CSRF token (local identity profile)
      responses:
        '200':
          description: CSRF token and HttpOnly session cookie; never cached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfResponse'}
        default: {$ref: '#/components/responses/IdentityProblem'}
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Session and CSRF rotated; opaque cookie is not in JSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfResponse'}
        default: {$ref: '#/components/responses/IdentityProblem'}
  /api/v1/me:
    get:
      operationId: getMe
      security: [{session: []}]
      parameters:
        - name: X-Space-Id
          in: header
          schema: {type: string, format: uuid}
          description: Optional space selector; membership is always verified
      responses:
        '200':
          description: Current actor and authorized space summaries only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        default: {$ref: '#/components/responses/IdentityProblem'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{session: []}]
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Session revoked and cookie cleared}
        default: {$ref: '#/components/responses/IdentityProblem'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: ap_session}
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 43, maxLength: 43}
      description: Session-bound token; writes also require an exact allowed Origin
  responses:
    IdentityProblem:
      description: Identity request rejected (400/401/403/404/409/429/503)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 12, maxLength: 128}
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: {type: string, minLength: 43, maxLength: 43}
    MeResponse:
      type: object
      additionalProperties: false
      required: [id, username, platformAdmin, spaces]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        platformAdmin: {type: boolean}
        spaces:
          type: array
          items: {$ref: '#/components/schemas/SpaceResponse'}
    SpaceResponse:
      type: object
      additionalProperties: false
      required: [id, type, role, objectLimitBytes]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [PERSONAL, ORGANIZATION]}
        role: {type: string, enum: [OWNER, ADMIN, MEMBER, VIEWER]}
        objectLimitBytes: {type: integer, minimum: 0}
    ReadinessResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [READY, NOT_READY]}
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP]
    Problem:
      type: object
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        traceId: {type: string}
        retryable: {type: boolean}
        resourceId: {type: string}
