openapi: 3.1.0
info:
  title: Agent PlatForm API
  version: 0.1.0
  description: "R5 workbench, pinned chat attachments and versioned context policy. Capabilities require validated deployment flags."
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check application shell health
      responses:
        "200":
          description: The application shell is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          description: Structured failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/readiness:
    get:
      operationId: getReadiness
      summary: Check baseline schema and required dependency connectivity
      responses:
        "200":
          description: Baseline dependencies reachable and schema compatible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Baseline unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Create or rotate a session-bound CSRF token (local identity profile)
      responses:
        "200":
          description: CSRF token and HttpOnly session cookie; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session and CSRF rotated; opaque cookie is not in JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - session: []
      parameters:
        - name: X-Space-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Optional space selector; membership is always verified
      responses:
        "200":
          description: Current actor and authorized space summaries only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie cleared
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/models:
    get:
      operationId: getModels
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModels"
        default: &a1
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/conversations:
    get:
      operationId: getConversations
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: cursor
          in: query
          schema: &a5
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversations"
        default: *a1
    post:
      operationId: createConversation
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversation"
      responses:
        "201":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default: *a1
  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - &a2
          name: id
          in: path
          required: true
          schema: &a4
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default: *a1
  /api/v1/conversations/{id}/snapshot:
    get:
      operationId: getConversationSnapshot
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSnapshot"
        default: *a1
  /api/v1/conversations/{id}/tasks:
    post:
      operationId: submitChatTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitChatTask"
      responses:
        "202":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAccepted"
        default: *a1
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTask"
        default: *a1
  /api/v1/tasks/{id}/usage:
    get:
      operationId: getTaskUsage
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUsages"
        default: *a1
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancel intent committed; execution is not stopped until confirmed.
            Repeated intent is idempotent; prior terminal success remains
            unchanged. Unknown remote outcome retains reservations and is never
            replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTask"
        default: *a1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
  /api/v1/conversations/{id}/events:
    get:
      operationId: getConversationEvents
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - *a2
        - name: after
          in: query
          schema: &a10
            type: integer
            minimum: 0
            maximum: 9007199254740991
          description: Committed cursor, default0; wins over Last-Event-ID.
            Malformed/unsafe integer400; negative/ahead409; below persisted
            pruned-through watermark410. Equality with watermark is valid.
            Rebase from snapshot on409/410.
        - name: Last-Event-ID
          in: header
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        "200":
          description: SSE event platform_event; id is seq. Only committed events, Unicode
            codepoint offsets. Disconnect never cancels. Eight streams maximum;
            excess503 STREAM_CAPACITY_EXCEEDED. Lifetime25s, heartbeat2s;
            reconnect from applied cursor. Each page at most256 events/1MiB,
            oversized503 EVENT_STREAM_OVERSIZED requires snapshot. Preflight
            failures use Problem; after headers commit close the stream on
            failure, never emit a business failure or Problem as an event.
          content:
            text/event-stream:
              schema:
                type: string
        default: *a1
  /api/v1/workspaces/{id}/settings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: X-Space-Id, in: header, required: false, schema: {type: string, format: uuid}}
    get:
      operationId: workspaceConfiguration
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Versioned workspace overrides
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfiguration'}
        default: *a1
    patch:
      operationId: updateWorkspaceConfiguration
      security: [{cookieAuth: []}]
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigurationOverrides'}
      responses:
        "200":
          description: Updated workspace overrides
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceConfiguration'}
        default: *a1
  /api/v1/me/capability-bindings:
    parameters:
      - {name: X-Space-Id, in: header, required: false, schema: {type: string, format: uuid}}
    get:
      operationId: personalCapabilityBindings
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Versioned personal selections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityBindingSet'}
        default: *a1
    put:
      operationId: replacePersonalCapabilityBindings
      security: [{cookieAuth: []}]
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityBindingUpdate'}
      responses:
        "200":
          description: Accepted binding snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityBindingSet'}
        default: *a1
  /api/v1/workspaces/{id}/capability-bindings:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: X-Space-Id, in: header, required: false, schema: {type: string, format: uuid}}
    get:
      operationId: workspaceCapabilityBindings
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Versioned workspace selection or inheritance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityBindingSet'}
        default: *a1
    put:
      operationId: replaceWorkspaceCapabilityBindings
      security: [{cookieAuth: []}]
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityBindingUpdate'}
      responses:
        "200":
          description: Accepted binding snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityBindingSet'}
        default: *a1
  /api/v1/effective-capabilities:
    get:
      operationId: effectiveCapabilities
      security: [{cookieAuth: []}]
      parameters:
        - {name: workspaceId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: X-Space-Id, in: header, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Effective selections and currently unavailable versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveCapabilities'}
        default: *a1
  /api/v1/me/preferences:
    get:
      operationId: chatPreferences
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPreferences"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
    patch:
      operationId: updateChatPreferences
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPreferences"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: &a3
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatPreferences"
  /api/v1/effective-config:
    get:
      operationId: effectiveChatConfig
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveChatConfig"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - {name: workspaceId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: modelId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: credentialSource, in: query, required: false, schema: {type: string, enum: [PLATFORM, USER]}}
        - {name: planMode, in: query, required: false, schema: {type: boolean}}
        - {name: permissionMode, in: query, required: false, schema: {type: string, enum: [RISK_BASED, FULL]}}
  /api/v1/me/model-credentials:
    get:
      operationId: modelCredentials
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/me/model-credentials/deepseek:
    put:
      operationId: putUserModelCredential
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: *a3
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutModelCredential"
    delete:
      operationId: revokeUserModelCredential
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCredentials"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: *a3
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a3
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/tasks/{id}/configuration:
    get:
      operationId: taskConfiguration
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskConfiguration"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: id
          in: path
          required: true
          schema: &a12
            type: string
            format: uuid
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/tasks/{id}/diagnostics:
    get:
      operationId: getTaskDiagnostics
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized committed platform state; no provider secrets or
            internal reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDiagnostics"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/tasks/{id}/reconciliation:
    get:
      operationId: getTaskReconciliation
      tags:
        - chat
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Live-authorized read-only cancellation and reconciliation
            projection; no evidence content, provider secrets or internal paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReconciliation"
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Space-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
  /api/v1/tasks/{id}/recovery:
    get:
      operationId: getTaskRecovery
      tags: [ chat ]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Space-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Read-only metadata candidate; trusted operator and claim must
            verify full state integrity before restoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRecovery" }
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/workspaces:
    get:
      security: &a15
        - session: []
      parameters:
        - &a16
          $ref: "#/components/parameters/SpaceSelector"
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      operationId: listWorkspaces
      responses:
        "200":
          description: Authorized workspace storage state; environment execution remains
            unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        default: &a17
          $ref: "#/components/responses/IdentityProblem"
    post:
      security: *a15
      parameters:
        - *a16
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspace"
      responses:
        "202":
          description: Authorized workspace storage state; environment execution remains
            unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default: *a17
  /api/v1/workspaces/{id}:
    get:
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      operationId: getWorkspace
      responses:
        "200":
          description: Authorized workspace storage state; environment execution remains
            unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/workspaces/{id}/retry:
    post:
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/SpaceSelector"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[1-9][0-9]*"$
      operationId: retryWorkspace
      responses:
        "202":
          description: Authorized workspace storage state; environment execution remains
            unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/IdentityProblem"
  /api/v1/workspaces/{id}/environment:
    parameters:
      - $ref: "#/components/parameters/SpaceSelector"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      security: [{ session: [] }]
      operationId: getWorkspaceEnvironment
      responses:
        "200":
          description: Independent environment projection; absent environment is NOT_CREATED revision0 without allocation
          headers:
            ETag: { schema: { type: string }, description: Quoted environment revision }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEnvironment" }
        default: { $ref: "#/components/responses/IdentityProblem" }
    post:
      security: [{ session: [] }]
      operationId: prepareWorkspaceEnvironment
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/EnvironmentMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyEnvironmentCommand" }
      responses:
        "202":
          description: Durable prepare operation; repeat returns original operation identity separately from current projection
          headers:
            ETag: { schema: { type: string }, description: Quoted environment revision }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentSubmission" }
        default: { $ref: "#/components/responses/IdentityProblem" }
    delete:
      security: [{ session: [] }]
      operationId: deleteWorkspaceEnvironment
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/EnvironmentMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyEnvironmentCommand" }
      responses:
