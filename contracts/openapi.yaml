        - $ref: "#/components/parameters/SpaceSelector"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/EnvironmentMatch"
      description: Empty body. Only a stopped known failure is retryable; BLOCKED queries original work.
      responses:
        "202":
          description: Stable retried preview identity
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePreview" }
        default: { $ref: "#/components/responses/IdentityProblem" }
  /api/v1/attachment-uploads:
