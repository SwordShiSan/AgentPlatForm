        default: { $ref: "#/components/responses/IdentityProblem" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ap_session
  parameters:
    PreviewId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
      description: Session-bound token; writes also require an exact allowed Origin
    SpaceSelector:
      name: X-Space-Id
      in: header
      required: false
      schema: *a4
      description: Optional selector; current membership and credential policy are
        always checked.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *a4
      description: Reuse for an uncertain response. Same actor/space/path/key with
        another body returns409.
  responses:
    IdentityProblem:
      description: Identity request rejected (400/401/403/404/409/429/503)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CapabilitySelection:
      type: object
      additionalProperties: false
      required: [capabilityId, versionId]
      properties:
        capabilityId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
    CapabilityBindingUpdate:
      type: object
      additionalProperties: false
      required: [inheritPersonal, selections]
      properties:
        inheritPersonal: {type: boolean}
        selections:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/CapabilitySelection'}
    CapabilityBindingSet:
      type: object
      additionalProperties: false
      required: [revision, inheritPersonal, selections]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        inheritPersonal: {type: boolean}
        selections:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/CapabilitySelection'}
    EffectiveCapabilities:
      type: object
      additionalProperties: false
      required: [source, selections, unavailable]
      properties:
        source: {type: string, enum: [PERSONAL, WORKSPACE]}
        selections:
          type: array
          items: {$ref: '#/components/schemas/CapabilitySelection'}
        unavailable:
          type: array
          items: {$ref: '#/components/schemas/CapabilitySelection'}
    PreviewRequest:
      type: object
      additionalProperties: false
      required: [versionId, format]
      properties:
        versionId: { type: string, format: uuid }
        format: { type: string, enum: [AUTO, PDF, IMAGE, HTML_STATIC] }
    FilePreview:
      type: object
      additionalProperties: false
      required: [id, fileId, versionId, state, format, mediaType, bytes, sha256, pages, errorCode, retryable, revision, allowedActions]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [FILE_VERSION, CHAT_ATTACHMENT] }
        attachmentId: { type: [string, "null"], format: uuid }
        fileId: { type: [string, "null"], format: uuid }
        versionId: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, READY, FAILED, BLOCKED] }
        format: { type: string, enum: [AUTO, PDF, IMAGE, TEXT, HTML_STATIC] }
        mediaType: { type: [string, "null"], enum: [application/pdf, image/png, text/plain, null] }
        bytes: { type: [integer, "null"], minimum: 0, maximum: 104857600 }
        sha256: { type: [string, "null"], pattern: '^[a-f0-9]{64}$' }
        pages: { type: [integer, "null"], minimum: 1, maximum: 200 }
        errorCode: { type: [string, "null"], pattern: '^[A-Z_]{1,64}$' }
        retryable: { type: boolean }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [VIEW, DOWNLOAD_SOURCE, RETRY, QUERY] }
    TaskDirectoryGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - scopeId
        - path
        - capabilities
        - expiresAt
        - revokedAt
        - active
        - policyVersion
      properties:
        id:
          type: string
          format: uuid
        scopeId:
          type: string
          format: uuid
        path:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
              - LIST
              - READ
              - WRITE
          minItems: 1
          maxItems: 3
          uniqueItems: true
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        active:
          type: boolean
        policyVersion:
          type: string
    TaskPermissions:
      type: object
      additionalProperties: false
      required:
        - taskId
        - workspaceId
        - mode
        - version
        - policyVersion
        - mutable
        - effectiveRestrictions
        - grants
      properties:
        taskId:
          type: string
          format: uuid
        workspaceId:
          type:
            - string
            - "null"
          format: uuid
        mode:
          type: string
          enum:
            - RISK_BASED
            - FULL
          default: RISK_BASED
        version:
          type: integer
          minimum: 1
        policyVersion:
          type: string
        mutable:
          type: boolean
        effectiveRestrictions:
          type: array
          items:
            type: string
        grants:
          type: array
          items:
            $ref: "#/components/schemas/TaskDirectoryGrant"
    TaskPermissionScope:
      type: object
      additionalProperties: false
      required:
        - scopeId
        - path
        - capabilities
      properties:
        scopeId:
          type: string
          format: uuid
        path:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
              - LIST
              - READ
              - WRITE
    TaskPermissionScopes:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskPermissionScope"
        nextCursor:
          type: [string, "null"]
          format: uuid
    TaskPermissionPatch:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - RISK_BASED
            - FULL
          default: RISK_BASED
    TaskGrantRequest:
      type: object
      additionalProperties: false
      required:
        - scopeId
        - capabilities
      properties:
        scopeId:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            type: string
            enum:
              - LIST
              - READ
              - WRITE
          minItems: 1
          maxItems: 3
          uniqueItems: true
    CreateFileUpload:
      type: object
      additionalProperties: false
      required:
        - path
        - bytes
        - sha256
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        bytes:
          type: integer
          minimum: 0
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        fileId:
          type: string
          format: uuid
        baseVersionId:
          type: string
          format: uuid
    FileUpload:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - fileId
        - versionId
        - path
        - bytes
        - sha256
        - state
        - operationId
        - revision
        - expiresAt
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        path:
          type: string
        bytes:
          type: integer
          minimum: 0
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
            - CREATED
            - UPLOADING
            - VERIFYING
            - VERIFIED
            - QUEUED
            - COMMITTED
            - ABORTED
            - EXPIRED
            - UNKNOWN
        operationId:
          type:
            - string
            - "null"
          format: uuid
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expiresAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          items:
            type: string
            enum:
              - UPLOAD
              - COMPLETE
              - READ
    DeletedFileItem:
      type: object
      additionalProperties: false
      required: [id, workspaceId, path, kind, versionId, revision, deletionOperationId, deletedAt, retainUntil, canRestore]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        path: {type: string}
        kind: {type: string, enum: [FILE, DIRECTORY]}
        versionId: {type: [string, 'null'], format: uuid}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        deletionOperationId: {type: string, format: uuid}
        deletedAt: {type: string, format: date-time}
        retainUntil: {type: string, format: date-time}
        canRestore: {type: boolean}
    DeletedFilePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DeletedFileItem'}
        nextCursor: {type: [string, 'null'], format: uuid}
    FileMutationPreview:
      type: object
      additionalProperties: false
      required: [revision, entries, allConfirmed]
      properties:
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        entries: {type: integer, minimum: 1, maximum: 1001}
        allConfirmed: {type: boolean}
    FileMutationRequest:
      type: object
      additionalProperties: false
      required: [operationId, uploadId, state, operation]
      properties:
        operationId: {type: [string, 'null'], format: uuid}
        uploadId: {type: [string, 'null'], format: uuid}
        state: {type: string}
        operation:
          anyOf:
            - {$ref: '#/components/schemas/FileOperation'}
            - {type: 'null'}
    ArtifactItem:
      type: object
      additionalProperties: false
      required: [id, workspaceId, taskId, operationId, fileId, versionId, title, sha256, bytes, contentState, testStatus]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        operationId: {type: string, format: uuid}
        fileId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 4096}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        bytes: {type: integer, minimum: 0, maximum: 104857600}
        contentState: {type: string, enum: [VERIFIED_CONTENT]}
        testStatus: {type: string, enum: [PASS, FAIL, NOT_RUN]}
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ArtifactItem'}
        nextCursor: {type: [string, 'null'], format: uuid}
    FileVersionItem:
      type: object
      additionalProperties: false
      required: [id, fileId, sha256, bytes, createdAt, sourceVersionId]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        bytes: { type: integer, minimum: 0, maximum: 104857600 }
        createdAt: { type: string, format: date-time }
        sourceVersionId: { type: [string, 'null'], format: uuid }
    FileVersionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FileVersionItem' }
